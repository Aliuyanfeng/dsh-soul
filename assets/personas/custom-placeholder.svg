<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="custom persona">
  <!--
    自定义预设的专用贴图（自建人设没有配套插画，用这张兜底）。

    设计约束（与内置插画对齐，才能在同一排卡片里视觉重量一致）：
      · 512×512、圆角 112（与 placeholder.svg 同规格）
      · 背景用同一族蓝紫渐变，保证同排卡片的明度接近
      · **形态刻意与官方鲸鱼区分**：鲸鱼代表「内置、官方提供」，
        这里用「调色板 + 笔」表达「你自己配的」——语义可自解释，
        不必依赖文字说明
      · 不写死深色（主题色由卡片渐变底与遮罩承担），本图自身是浅色系，
        深浅主题下都靠卡片底部遮罩保证文字对比度
  -->
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EEFF"/>
      <stop offset="1" stop-color="#DCD4FF"/>
    </linearGradient>
    <linearGradient id="cp-palette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A48CFF"/>
      <stop offset="1" stop-color="#6D4DFE"/>
    </linearGradient>
    <linearGradient id="cp-brush" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD9A8"/>
      <stop offset="1" stop-color="#F0A75C"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#cp-bg)"/>

  <!-- 调色板：带握孔的不规则圆盘，示意「可调的人格维度」 -->
  <path d="M256 116c-77.3 0-140 62.7-140 140s62.7 140 140 140c22.1 0 40-17.9 40-40 0-10.4-4-19.9-10.5-27.1-6.4-7.1-10.3-16.4-10.3-26.4 0-22.1 17.9-40 40-40h38.9c29.8 0 53.9-24.1 53.9-53.9C408 155.2 338.5 116 256 116z"
        fill="url(#cp-palette)"/>
  <!-- 握孔 -->
  <circle cx="203" cy="232" r="26" fill="#F2EEFF"/>
  <!-- 颜料点：四个色块代表可调维度 -->
  <circle cx="163" cy="300" r="19" fill="#FF8FA8"/>
  <circle cx="214" cy="336" r="15" fill="#7FD8C4"/>
  <circle cx="270" cy="349" r="13" fill="#FFD98E"/>

  <!-- 画笔：斜插在调色板右下，示意「自己动手配」 -->
  <g transform="rotate(38 350 330)">
    <rect x="336" y="196" width="28" height="150" rx="14" fill="url(#cp-brush)"/>
    <rect x="333" y="330" width="34" height="24" rx="8" fill="#8A94A6"/>
    <rect x="343" y="352" width="14" height="34" rx="6" fill="#5C6675"/>
  </g>
</svg>
