# 过期 issue 自动标记与关闭
#
# 两段独立计时：
#   静默 14 天  → 打上 stale 标签 + 留言（issue 仍然打开，只是提醒）
#   再静默 14 天 → 自动关闭
# 期间任何活动（评论 / 改标题 / 加标签）都会撤销标签并让计时归零。
#
# ⚠️ 定时工作流在「仓库连续 60 天没有任何 commit」时会被 GitHub 自动禁用，
#    而且 issue / PR / 评论都不算活动。发现不再打标记时，先看 Actions 页顶部横幅。
name: Close inactive issues

on:
  schedule:
    # 每天 UTC 01:30（北京时间 09:30）。避开整点，减少被调度高峰延迟甚至丢弃的概率。
    - cron: "30 1 * * *"
  # 允许在 Actions 页手动触发，不用等定时
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      # actions/stale 不会自动创建标签：标签缺失时它只是沉默地不生效。
      - name: 确保 stale 标签存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create stale --repo "${{ github.repository }}" --color E4E669 --description "长时间无活动，待确认是否仍需要" --force

      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-issue-stale: 14
          days-before-issue-close: 14
          stale-issue-label: "stale"
          remove-stale-when-updated: true
          stale-issue-message: >
            这个 issue 已 14 天没有新活动，先标记为 stale。
            如果 14 天内没有回复，它会被自动关闭；
            补充信息，或回复一句「问题仍然存在」，即可保留。
          close-issue-message: >
            因长时间无活动，这个 issue 已被自动关闭。
            如果问题依然存在，欢迎重新打开本 issue，或新开一个并关联本条编号。
          # 带这些标签的 issue 永不参与：静默了很久的 bug 仍然是个 bug
          exempt-issue-labels: "bug,enhancement,documentation,good first issue,help wanted"

          # PR 暂不纳管：-1 表示关闭该行为
          days-before-pr-stale: -1
          days-before-pr-close: -1

          # 单次运行最多处理的条目数（默认 30）
          operations-per-run: 50
